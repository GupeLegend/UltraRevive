name: UltraRevive
version: '1.0'
main: mc.gupe.revive.UltraRevive
api-version: '26.1'
author: Social Studio
description: Don't die outright - go DOWNED and let your team pick you back up. With three hard-to-get totems of its own that change the rescue's rules.
website: https://gupe.dev/en/wiki/ultrarevive/
folia-supported: true
# All OPTIONAL. LuckPerms is only used to show the player's rank; floodgate for the Bedrock menu.
softdepend: [LuckPerms, LPC, ItemEdit, ItemTag, floodgate]
# Loads before the plugins that build the server's resource pack, and before Geyser, so the textures
# it installs in them are read on the same boot.
loadbefore: [ResourcePackManager, Nexo, Oraxen, ItemsAdder, CraftEngine, EcoItems, Geyser-Spigot]

commands:
  ultrarevive:
    description: UltraRevive commands.
    aliases: [ur, revivir]
    usage: |
      /ur help                         - lists every command
      /ur reload                       - reloads the config and languages
      /ur revive|down|finish <player>  - manage downed players (admin)
      /ur give <self|boost|end> [plyr] - hand out the totems (admin)
      /ur stats [player]               - rescue statistics
      /ur surrender                    - give up (while downed)

permissions:
  ultrarevive.admin:
    description: Administration commands.
    default: op
  ultrarevive.bypass:
    description: This player does NOT go down (dies normally instead).
    default: false
  ultrarevive.revive:
    description: Allows reviving other players.
    default: true
  ultrarevive.surrender:
    description: Allows giving up while downed.
    default: true

  # Nodes under the plugin's previous name (ultrarevivir.*), declared as PARENTS of the new ones
  # so anyone who was already granted them in LuckPerms keeps working without changing anything.
  ultrarevivir.admin:
    default: false
    children: { ultrarevive.admin: true }
  ultrarevivir.bypass:
    default: false
    children: { ultrarevive.bypass: true }
  ultrarevivir.revive:
    default: false
    children: { ultrarevive.revive: true }
  ultrarevivir.surrender:
    default: false
    children: { ultrarevive.surrender: true }
